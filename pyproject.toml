[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxo-hep-bridge"
version = "0.1.0"
description = "Pont Alcatel OXO (UA/UAUDP/UA3G/NOE) vers HOMER via tshark -T ek + HEP/EEP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yves deuscher" }]
dependencies = ["loguru>=0.7"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.7",
]

[project.scripts]
oxo-hep-bridge = "oxo_hep_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Catalogues gettext compilés (issue #50, `tools/i18n.py compile`) : tous
# ceux présents sont embarqués, sans liste de langues à tenir à jour ici.
[tool.setuptools.package-data]
oxo_hep_bridge = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["sample_captures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PERF", "SIM", "PL", "TRY", "S"]
# TRY003 (« pas de message détaillé hors de la classe d'exception ») est
# ignoré : ce projet lève des ValueError/TsharkError internes simples pour
# des erreurs de validation locales (transport HEP inconnu, interface/pcap
# manquant...) — créer une sous-classe d'exception dédiée par message
# ajouterait de la complexité sans bénéfice réel ici (pas d'API publique à
# distinguer par type d'erreur). Voir docs/architecture.md#contrôle-de-type-statique-mypy
# pour un choix similaire (mypy limité à src/+tools/).
ignore = ["PLR0913", "PLR2004", "E501", "PERF401", "PLR0912", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# S (flake8-bandit) désactivé sur les tests : `assert` y est l'idiome
# normal de pytest (751 occurrences légitimes, pas un risque de sécurité),
# de même que des ports/chemins temporaires codés en dur pour les besoins
# du test (S108) ou le lancement de `tshark` par son nom simple (S607,
# résolu via PATH — délibéré, voir `tshark_path` dans config.py).
"tests/*" = ["PLR2004", "B017", "PLR0917", "S"]

[tool.mypy]
python_version = "3.11"
# Périmètre volontairement limité au package installable + à l'outil
# standalone (tous deux déjà entièrement annotés) — pas tests/, où des
# senders/faux objets de test assignés à un attribut typé sur la classe de
# base casseraient le typage sans bénéfice réel (voir docs/architecture.md,
# section « Contrôle de type statique (mypy) »).
files = ["src/oxo_hep_bridge", "tools"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Sécurité si l'environnement CI résout une version de loguru sans les
# marqueurs py.typed inline (loguru>=0.7 les fournit normalement).
module = "loguru.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["oxo_hep_bridge"]
branch = true
